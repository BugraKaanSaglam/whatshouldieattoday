name: yemek_tarifi_app
description: "App For Food Recipes"
publish_to: 'none'
version: 3.1.0+31

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter 
  connectivity_plus: ^7.0.0
  provider: ^6.1.2
  logger: ^2.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  dropdown_search: ^7.0.0
  supabase_flutter: ^2.10.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8
  # 9.1.0 currently fails Xcode 26 module compilation; keep the last
  # compatible stable plugin until the upstream header fix lands.
  google_mobile_ads: 9.0.0
  app_links: ^7.2.1
  flutter_cache_manager: ^3.4.1
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.4
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  go_router: ^17.0.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#160D07"
    theme_color: "#B77A2C"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:   
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets: 
    - assets/icon/
    - assets/images/
    - assets/translations/

flutter_native_splash:
  color: "#160D07"
  color_dark: "#160D07"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: contain

  android_12:
    color: "#160D07"
    image: assets/icon/icon.png
    icon_background_color: "#160D07"
    fullscreen: true
